services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triage_db
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
    ports:
      - "5432:5432"
    volumes:
      - triage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d triage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://triage_user:triage_password@db:5432/triage_db
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  triage_pgdata:
